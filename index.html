<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keluarga Besar - Digital Album 1447H</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <style>
        :root {
            --sage: #5d6d4e;
            --light-sage: #f4f7f1;
            --gold: #c5a059;
            --dark: #1a1f18;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; scroll-behavior: smooth; }

        body {
            background-color: var(--light-sage);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: var(--dark);
        }

        /* Custom Cursor */
        #cursor {
            width: 20px; height: 20px; border: 2px solid var(--sage); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999; transition: transform 0.1s ease;
            background: rgba(93, 109, 78, 0.1);
        }

        /* Hero Section */
        header {
            height: 100vh; width: 100%; overflow: hidden; position: relative;
            display: flex; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1584214432174-88463878b277?q=80&w=2000') center/cover no-repeat;
            z-index: -1; animation: kenBurns 20s infinite alternate;
        }
        @keyframes kenBurns { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* Ketupat Gantung */
        .ketupat-gantung {
            position: absolute; top: 20px; font-size: 3rem; opacity: 0.8;
            animation: swingKetupat 4s ease-in-out infinite alternate;
            transform-origin: top center; z-index: 5;
        }
        @keyframes swingKetupat { 0% { transform: rotate(-10deg); } 100% { transform: rotate(10deg); } }

        /* Search Bar Sticky */
        .search-container {
            position: sticky; top: 20px; z-index: 100;
            display: flex; justify-content: center; margin: 40px 0; padding: 0 20px;
        }
        #photoSearch {
            width: 100%; max-width: 500px; padding: 15px 25px;
            border-radius: 50px; border: 1px solid rgba(93, 109, 78, 0.2);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            outline: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-family: 'Poppins', sans-serif;
        }

        /* Gallery Grid */
        .container {
            max-width: 1400px; margin: 0 auto 100px; padding: 0 30px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;
        }

        .photo-card {
            background: white; padding: 12px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s;
            cursor: pointer;
        }

        .img-wrapper { width: 100%; height: 350px; overflow: hidden; border-radius: 10px; background: #ddd; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .photo-card:hover img { transform: scale(1.05); }

        .card-body { padding: 15px 5px; text-align: center; }
        .card-body h3 { font-family: 'Amiri', serif; color: var(--sage); font-size: 1.4rem; }

        /* Float Ornaments Background */
        .floating-ornament {
            position: fixed; pointer-events: none; z-index: -1;
            font-size: 1.5rem; opacity: 0.15; animation: floatUp 15s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Scroll Buttons */
        .scroll-tools { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn-scroll {
            width: 45px; height: 45px; background: var(--sage); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: 0.3s; opacity: 0; visibility: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-scroll.show { opacity: 1; visibility: visible; }

        footer { background: var(--dark); color: white; padding: 80px 20px; text-align: center; clip-path: polygon(0 10%, 100% 0, 100% 100%, 0% 100%); margin-top: 50px;}
    </style>
</head>
<body>

    <div id="cursor"></div>

    <div class="scroll-tools">
        <a href="#top" class="btn-scroll" id="scrollTop">▲</a>
        <a href="#footer" class="btn-scroll show">▼</a>
    </div>

    <header id="top">
        <div class="hero-bg"></div>
        
        <div class="ketupat-gantung" style="left: 10%;">🍙</div>
        <div class="ketupat-gantung" style="left: 25%; font-size: 2rem; animation-delay: 1s;">⭐</div>
        <div class="ketupat-gantung" style="left: 75%; animation-delay: 0.5s;">🍙</div>
        <div class="ketupat-gantung" style="left: 85%; font-size: 2rem; animation-delay: 1.5s;">🌙</div>

        <div class="hero-content">
            <p style="letter-spacing: 5px;" class="animate__animated animate__fadeInDown">ALBUM DIGITAL</p>
            <h1 class="animate__animated animate__zoomIn">Keluarga Besar</h1>
            <div style="width: 60px; height: 2px; background: var(--gold); margin: 15px auto;"></div>
            <p class="animate__animated animate__fadeInUp">1447 Hijriah • Momen Kebersamaan</p>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="photoSearch" placeholder="Cari nomor momen (1 - 112)...">
    </div>

    <div class="container" id="gallery-grid"></div>

    <footer id="footer">
        <h2 style="font-family: 'Amiri'; font-size: 2rem;">Taqabbalallahu Minna Wa Minkum</h2>
        <p style="opacity: 0.7; margin-top: 10px;">Dibuat dengan ❤️ untuk Keluarga Besar</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 800, once: true });
            generateGallery();
            initFloating();
        });

        // 1. Custom Cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 2. Generate Gallery
        function generateGallery() {
            const container = document.getElementById('gallery-grid');
            const total = 112;

            for (let i = 1; i <= total; i++) {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.setAttribute('data-number', i);
                card.setAttribute('data-aos', 'fade-up');
                
                // Menggunakan "./" untuk memastikan path relatif benar saat deploy
                const imgPath = `./${i}.jpeg`;

                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${imgPath}" alt="Foto ${i}" loading="lazy" 
                             onerror="this.onerror=null; this.src='./${i}.jpg'; this.setAttribute('data-fallback', 'true');">
                    </div>
                    <div class="card-body">
                        <h3>Momen #${i}</h3>
                        <p style="font-size: 0.75rem; color: #888; letter-spacing: 1px;">KLIK UNTUK DETAIL</p>
                    </div>
                `;

                card.onclick = function() {
                    // Cek apakah gambar yang sedang tampil adalah .jpeg atau .jpg hasil fallback
                    const currentImgSrc = this.querySelector('img').src;
                    
                    Swal.fire({
                        imageUrl: currentImgSrc,
                        title: `<span style="font-family:Amiri; color:var(--sage)">Momen Indah #${i}</span>`,
                        confirmButtonText: 'Tutup',
                        confirmButtonColor: '#5d6d4e',
                        showClass: { popup: 'animate__animated animate__fadeInUp' }
                    });
                };
                container.appendChild(card);
            }
            
            VanillaTilt.init(document.querySelectorAll(".photo-card"), {
                max: 10,
                speed: 400,
                glare: true,
                "max-glare": 0.2
            });
        }

        // 3. Fitur Pencarian
        document.getElementById('photoSearch').addEventListener('input', (e) => {
            const val = e.target.value;
            const cards = document.querySelectorAll('.photo-card');
            cards.forEach(card => {
                const num = card.getAttribute('data-number');
                card.style.display = num.includes(val) || val === "" ? "block" : "none";
            });
        });

        // 4. Scroll Buttons
        const scTop = document.getElementById('scrollTop');
        window.onscroll = () => {
            if (window.scrollY > 600) scTop.classList.add('show');
            else scTop.classList.remove('show');
        };

        // 5. Animasi Latar Belakang
        function initFloating() {
            const items = ['✨', '🌟', '🌙', '🍃', '🕌'];
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'floating-ornament';
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 95 + 'vw';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 15000);
            }, 3000);
        }
    </script>
</body>
</html>
